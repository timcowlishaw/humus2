[project]
name = "humus"
version = "0.1.0"
description = "A decaying database"
authors = [
    {name = "Tim Cowlishaw",email = "tim@timcowlishaw.co.uk"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "diff-match-patch (>=20241021,<20241022)",
    "ipython (>=9.11.0,<10.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=1.20.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]
