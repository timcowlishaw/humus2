<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <title>Humus2</title>
  </head>
  <body>
    <pre>"Put everything on the rotchain, the very mutable ledger where things change constantly and kind of just disappear over time." -- <a href="https://web.archive.org/web/20211118074812/https://twitter.com/APndrgrst/status/1461239757246136321" target="_blank">(Anna Prendergrast (@Aprndrgrst), 18th November 2021)</a></pre>
    <div class="text" contenteditable="true" id="text-display">
      {{ text }}
    </div>
    <form action="/" method="post" id="form">
      <input name="text" type="hidden" id="text-input" />
      <input type="submit" value="Update!" />
    </form>
    <script src="{{ url_for('static', filename='application.js') }}"></script>
  </body>
</html>
