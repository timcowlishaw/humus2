<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Humus2, the decaying datbase" />
        <meta name="keywords" content="humus, decay, loss" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='styles.css') }}" />
        <title>Humus2</title>
    </head>
    <body>
        <div id="wrapper">
            <div id="world">
                {% for record in records %}
                    {% include "note.html" %}
                {% endfor %}
            </div>
        </div>
        <div id="add-controls">
            <p>
                Això es <i>humus</i> - un petit centre de dades comunitari, que és una mica oblidós.
            </p>
            <p>Tots els seus records s'esvaeixen, de mica en mica.</p>
            <p>
                <strong>Què tens al cap?</strong> - Aporta un imatge o texte.
            </p>
            <div class="controls-inner">
                <div>
                    <button id="add-note"
                            type="button"
                            aria-label="Add a new note"
                            title="Add a new note">📝</button>
                    Escriu una nota
                </div>
                <div>
                    <button id="add-photo-note"
                            type="button"
                            aria-label="Add a new note with a photo"
                            title="Add a new note with a photo">📸</button>
                    Fes una foto
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='application.js') }}"></script>
        <template id="note-template">
            <div class="text-container">
                <div class="text-inner">
                    <pre contenteditable="true" class="text-display"></pre>
                </div>
            </div>
        </template>
    </body>
</html>
