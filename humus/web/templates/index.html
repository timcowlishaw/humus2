<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Humus2, the decaying datbase" />
        <meta name="keywords" content="humus, decay, loss" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='styles.css') }}" />
        <title>Humus2</title>
    </head>
    <body>
        <div id="wrapper">
            <div id="world">
                <div id="text-container" class="draggable" style="left: 50px; top: 50px;">
                    <pre class="text" contenteditable="true" id="text-display">{{ text|safe }}</pre>
                    <form action="{{ url_for("update") }}" method="post" id="form">
                        <input name="text" type="hidden" id="text-input" />
                        <input type="submit" value="Update!" />
                    </form>
                </div>
            </div>
            <div id="quote">
                <p>
                    <i>"Put everything on the rotchain, the very mutable ledger where things change constantly and kind of just disappear over time."</i>-- <a href="https://web.archive.org/web/20211118074812/https://twitter.com/APndrgrst/status/1461239757246136321"
    target="_blank">(Anna Prendergrast (@Aprndrgrst), 18th November 2021)</a>
                </p>
                <p>
                    <b>Click and drag in empty space to move, scroll to zoom, double-click to add a new note.</b>
                </p>
            </div>
        </div>
        <script src="{{ url_for('static', filename='application.js') }}"></script>
    </body>
</html>
